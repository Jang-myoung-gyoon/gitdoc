name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "desktop/**"
      - "templates/**"
      - "static/**"
      - "*.py"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 65
    env:
      GITDOC_DISTRIBUTION: ${{ github.repository == 'Jang-myoung-gyoon/gitdoc' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the tag matches the macOS build version
        if: env.GITDOC_DISTRIBUTION == 'true'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/native/Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/native
          key: aarch64-apple-darwin
      - name: Check the release updater key configuration
        if: env.GITDOC_DISTRIBUTION == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'codex/release-'))
        env:
          GITDOC_SPARKLE_PUBLIC_KEY: ${{ vars.GITDOC_SPARKLE_PUBLIC_KEY || vars.SPARKLE_PUBLIC_KEY || secrets.GITDOC_SPARKLE_PUBLIC_KEY || secrets.SPARKLE_PUBLIC_KEY }}
          GITDOC_SPARKLE_PRIVATE_SEED: ${{ secrets.GITDOC_SPARKLE_PRIVATE_SEED || secrets.SPARKLE_PRIVATE_KEY || secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -eu
          missing=0
          if [ -z "$GITDOC_SPARKLE_PUBLIC_KEY" ]; then
            echo '::error::Missing Sparkle public key for GitHub Actions (GITDOC_SPARKLE_PUBLIC_KEY).'
            missing=1
          fi
          if [ -z "$GITDOC_SPARKLE_PRIVATE_SEED" ]; then
            echo '::error::Missing Sparkle seed for GitHub Actions (GITDOC_SPARKLE_PRIVATE_SEED).'
            missing=1
          fi
          test "$missing" = 0
          printf '%s\n' "$GITDOC_SPARKLE_PRIVATE_SEED" | sh packaging/sparkle-key-check.sh "$GITDOC_SPARKLE_PUBLIC_KEY"
          printf '%s\n' 'Sparkle release key configuration verified.'
      - name: Assemble the macOS app
        env:
          GITDOC_SPARKLE_PUBLIC_KEY: ${{ vars.GITDOC_SPARKLE_PUBLIC_KEY || vars.SPARKLE_PUBLIC_KEY || secrets.GITDOC_SPARKLE_PUBLIC_KEY || secrets.SPARKLE_PUBLIC_KEY }}
        run: sh packaging/macos.sh --assemble-only
      - name: Build the ad-hoc disk image
        if: env.GITDOC_DISTRIBUTION != 'true'
        run: sh packaging/macos.sh --package-only
      - name: Sign the app and disk image with Developer ID
        if: env.GITDOC_DISTRIBUTION == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sh packaging/macos-sign.sh
      - name: Notarize and validate the signed disk image
        if: env.GITDOC_DISTRIBUTION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: sh packaging/macos-notarize.sh dist/GitDoc-*-macos-arm64.dmg
      - name: Generate the signed macOS appcast
        if: env.GITDOC_DISTRIBUTION == 'true'
        env:
          GITDOC_SPARKLE_PRIVATE_SEED: ${{ secrets.GITDOC_SPARKLE_PRIVATE_SEED || secrets.SPARKLE_PRIVATE_KEY || secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: sh packaging/sparkle-appcast.sh
      - name: Smoke test the disk image
        run: |
          set -eu
          image=$(ls dist/GitDoc-*-macos-arm64.dmg)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$RUNNER_TEMP/gitdoc-image" "$image"
          test -L "$RUNNER_TEMP/gitdoc-image/Applications"
          mkdir "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/gitdoc-image/GitDoc.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach -quiet "$RUNNER_TEMP/gitdoc-image"
          bundle="$RUNNER_TEMP/Applications/GitDoc.app"
          codesign --verify --deep --strict "$bundle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$bundle/Contents/Info.plist")" = GitDoc.icns
          cmp desktop/icons/GitDoc.icns "$bundle/Contents/Resources/GitDoc.icns"
          for name in GitDoc gitdoc-desktop gitdoc-pdf gitdoc-ocr; do
            test "$(lipo -archs "$bundle/Contents/MacOS/$name")" = arm64
          done
          "$bundle/Contents/Resources/python/bin/python3" -B packaging/smoke.py "$bundle/Contents/Resources/app" "$bundle"
          codesign --verify --deep --strict "$bundle"
          if [ "$GITDOC_DISTRIBUTION" = true ]; then
            spctl --assess --type execute --verbose=2 "$bundle"
          fi
      - name: Upgrade the published macOS v0.1.3 in an isolated directory
        if: env.GITDOC_DISTRIBUTION == 'true' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-'))
        run: |
          set -eu
          installed="$RUNNER_TEMP/Applications/GitDoc.app"
          previous="$RUNNER_TEMP/GitDoc-0.1.3-macos-arm64.dmg"
          mount="$RUNNER_TEMP/gitdoc-previous"
          curl --fail --location --retry 3 --proto '=https' -o "$previous" \
            'https://github.com/Jang-myoung-gyoon/gitdoc/releases/download/v0.1.3/GitDoc-0.1.3-macos-arm64.dmg'
          printf '%s  %s\n' 8023dec07373739b24d741074eacd717017baf3ff0a42c9d35dd271300a59876 "$previous" | shasum -a 256 --check
          xcrun stapler validate "$previous"
          mv "$installed" "$RUNNER_TEMP/GitDoc.next"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" "$previous"
          trap 'hdiutil detach -quiet "$mount" 2>/dev/null || true' EXIT
          ditto "$mount/GitDoc.app" "$installed"
          hdiutil detach -quiet "$mount"
          trap - EXIT
          "$installed/Contents/Resources/python/bin/python3" -E -s -B packaging/desktop-migration.py seed \
            "$installed/Contents/Resources/app" "$RUNNER_TEMP/gitdoc-upgrade"
          mv "$installed" "$RUNNER_TEMP/GitDoc.previous"
          mv "$RUNNER_TEMP/GitDoc.next" "$installed"
          "$installed/Contents/Resources/python/bin/python3" -E -s -B packaging/desktop-migration.py verify \
            "$installed/Contents/Resources/app" "$RUNNER_TEMP/gitdoc-upgrade"
      - uses: actions/upload-artifact@v4
        with:
          name: gitdoc-macos-arm64
          path: |
            dist/GitDoc-*-macos-arm64.dmg
            dist/gitdoc-macos-arm64-appcast.xml
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      GITDOC_DISTRIBUTION: ${{ github.repository == 'Jang-myoung-gyoon/gitdoc' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
      GITDOC_WINDOWS_UPDATE_SIGNERS: ${{ vars.GITDOC_WINDOWS_UPDATE_SIGNERS }}
      # Signed automatic installation remains disabled until an approved Windows signer is configured.
      GITDOC_WINDOWS_RELEASE_SIGNING: unsigned
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/native
          key: x86_64-pc-windows-msvc
      - name: Install Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build the installer
        run: ./packaging/windows.ps1
      - name: Smoke test the installer
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-Item dist\GitDoc-*-windows-x64-setup.exe).FullName
          $install = "$env:RUNNER_TEMP\GitDoc"
          $migrate = $env:GITDOC_DISTRIBUTION -eq 'true' -or $env:GITHUB_HEAD_REF -like 'codex/release-*'
          if ($migrate) {
            $old = "$env:RUNNER_TEMP\GitDoc-0.1.3-windows-x64-setup.exe"
            Invoke-WebRequest -Uri 'https://github.com/Jang-myoung-gyoon/gitdoc/releases/download/v0.1.3/GitDoc-0.1.3-windows-x64-setup.exe' -OutFile $old
            if ((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash -ine '2fc27caf0bfb38dcabee7fd7aa74d862e30a34e9cc4386539a64c48591a8c88e') { throw "Unexpected v0.1.3 installer hash" }
            $first = Start-Process $old -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$install`"" -Wait -PassThru
            if ($first.ExitCode -ne 0) { throw "v0.1.3 setup exited with $($first.ExitCode)" }
            & "$install\python\python.exe" -E -s -B packaging\desktop-migration.py seed "$install\app" "$env:RUNNER_TEMP\gitdoc-upgrade"
            if ($LASTEXITCODE -ne 0) { throw "Could not seed v0.1.3" }
          }
          $run = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$install`"" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "setup exited with $($run.ExitCode)" }
          ./packaging/check-windows-icon.ps1 -Executables @($setup, "$install\gitdoc-desktop.exe", "$install\unins000.exe")
          if ($migrate) {
            $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6A2E4C0B-3C0F-4F6E-9B57-7D1B6C1F5E21}_is1'
            $registration = Get-ItemProperty $uninstallKey
            $version = (Get-Content "$install\app\PACKAGED").Trim()
            if ($registration.DisplayVersion -ne $version -or $registration.InstallLocation.TrimEnd('\') -ine $install) { throw "The in-place install changed the identity or installation directory" }
            & "$install\python\python.exe" -E -s -B packaging\desktop-migration.py verify "$install\app" "$env:RUNNER_TEMP\gitdoc-upgrade"
            if ($LASTEXITCODE -ne 0) { throw "v0.1.4 did not reopen the v0.1.3 workspace" }
          }
          if ($env:GITDOC_DISTRIBUTION -eq 'true' -and $env:GITDOC_WINDOWS_RELEASE_SIGNING -eq 'signed') {
            $expected = $env:GITDOC_WINDOWS_UPDATE_SIGNERS.Trim() -split '\s+'
            $installedPins = Get-Content "$install\app\WINDOWS_UPDATE_SIGNERS"
            if (Compare-Object $expected $installedPins -CaseSensitive) { throw "Unexpected installed updater signer pins" }
          }
          if ($env:GITDOC_WINDOWS_RELEASE_SIGNING -eq 'unsigned') {
            if (Test-Path "$install\app\WINDOWS_UPDATE_SIGNERS") { throw "Unsigned builds must not enable automatic installation" }
            if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'NotSigned') { throw "Unexpected Windows signing state" }
          }
          $key = "HKCU:\Software\Classes\gitdoc"
          $command = (Get-Item "$key\shell\open\command").GetValue("")
          if ($command -ne "`"$install\gitdoc-desktop.exe`" `"%1`"") { throw "gitdoc:// opens $command" }
          & "$install\python\python.exe" packaging\smoke.py "$install\app" $install
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
          $run = Start-Process "$install\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "uninstall exited with $($run.ExitCode)" }
          if (Test-Path $key) { throw "the gitdoc:// handler survived the uninstall" }
          if (Test-Path "$install\gitdoc-desktop.exe") { throw "the uninstall left the app behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: gitdoc-windows-x64
          path: dist/GitDoc-*-windows-x64-setup.exe
          if-no-files-found: error
