name: Document editor regression

on:
  push:
    branches: ["main", "codex/**"]
    paths:
      - ".github/workflows/document-objects.yml"
      - "desktop/**"
      - "static/**"
      - "templates/**"
      - "*.py"
      - "tests/**"
      - "requirements*.txt"
  pull_request:
    paths:
      - ".github/workflows/document-objects.yml"
      - "desktop/**"
      - "static/**"
      - "templates/**"
      - "*.py"
      - "tests/**"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  document-objects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the document converters
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-impress poppler-utils fonts-nanum
      - &install-rhwp
        name: Install rhwp 0.9.0 for native Hangul tests
        run: |
          archive="$RUNNER_TEMP/rhwp.tar.gz"
          curl --fail --location --retry 3 -o "$archive" "https://github.com/edwardkim/rhwp/releases/download/v0.9.0/rhwp-v0.9.0-linux-x86_64.tar.gz"
          echo "837910d858162537f3f04b35ae8f5ad65fb42cc8e3582b1e174ce605b6ac7952  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/rhwp"
          tar -xzf "$archive" -C "$RUNNER_TEMP/rhwp"
          rhwp="$(find "$RUNNER_TEMP/rhwp" -type f -name rhwp -print -quit)"
          "$rhwp" --version
          echo "DOCVERS_RHWP=$rhwp" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-mcp.txt
      - name: Run editor regressions
        run: |
          python -m unittest discover -s tests -p test_document_objects.py -v
          python -m unittest discover -s tests -p test_presentation_edit.py -v
          python -m unittest discover -s tests -p test_blank_documents.py -v
          python -m unittest discover -s tests -p test_hangul_format.py -v
          python -m unittest discover -s tests -p test_hangul_table_cells.py -v

  desktop-toolbar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/native
      - name: Test the desktop editor controls
        run: cargo test --locked --manifest-path desktop/native/Cargo.toml

  browser-reader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-nanum
          python -m pip install -r requirements.txt -r requirements-mcp.txt openpyxl==3.1.5
          npm install --prefix "$RUNNER_TEMP/gitdoc-browser" --no-save --no-package-lock playwright@1.63.0
          node "$RUNNER_TEMP/gitdoc-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - *install-rhwp
      - name: Test scroll ownership in the real document viewer
        run: NODE_PATH="$RUNNER_TEMP/gitdoc-browser/node_modules" node tests/test_browser_scroll.cjs
